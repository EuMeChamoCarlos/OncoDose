spring.application.name=oncoDoseAPI

# Segredos nunca ficam no repositório: vêm do .env local (gitignored, modelo em .env.example)
# ou de variáveis de ambiente de verdade no servidor. Sem eles a aplicação não sobe.
spring.config.import=optional:file:.env[.properties]

#DB Config
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/onco_dose}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#JWT Config
api.security.token.secret=${JWT_SECRET}

#Error responses
spring.web.error.include-stacktrace=never
spring.web.error.include-message=always
