# Profile dev: dados sintéticos para demonstração (disciplina de Sistemas Web).
# Ativar: .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=dev"  (IntelliJ: Active profiles = dev)
# db/seed só tem o callback afterMigrate: roda a cada subida, é idempotente e não entra
# no flyway_schema_history, então subir sem o profile continua validando normalmente.
spring.flyway.locations=classpath:db/migration,classpath:db/seed
